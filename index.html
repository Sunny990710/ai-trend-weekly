<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#ffffff" />
<title>AI/IT 트렌드 위클리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    color-scheme: only light;
    --bg: #ffffff;
    --surface: #f7f8fa;
    --text: #16181d;
    --muted: #5f636b;
    --faint: #9aa0a8;
    --line: rgba(0,0,0,0.09);
    --accent: #2563eb;            /* 차분한 블루 액센트 */
    --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html {
    background-color: var(--bg);
    color: var(--text);
  }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  /* 은은한 상단 그라데이션 분위기 */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 320px;
    background: radial-gradient(120% 100% at 50% 0%, rgba(37,99,235,0.05), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 24px; }

  /* 마스트헤드 */
  header.masthead { padding: 64px 0 28px; }
  .kicker { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  header.masthead h1 { font-size: 40px; line-height: 1.1; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
  header.masthead p {
    color: var(--muted);
    margin: 12px 0 0;
    font-size: 14px;
    line-height: 1.4;
    white-space: nowrap;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    justify-content: flex-end;
    align-items: center;
    padding: 0 0 18px;
  }
  .toolbar-search {
    flex: 0 1 168px;
    max-width: 200px;
    min-width: 0;
    position: relative;
  }
  .toolbar-search svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 13px;
    color: var(--faint);
    pointer-events: none;
  }
  .toolbar input[type="search"],
  .toolbar input[type="date"] {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    width: 100%;
    height: 30px;
  }
  .toolbar input[type="search"] {
    padding-left: 28px;
  }
  .toolbar input[type="date"] {
    width: auto;
    min-width: 108px;
    padding: 4px 6px;
  }
  .toolbar input:focus {
    outline: 2px solid rgba(37, 99, 235, 0.2);
    border-color: var(--accent);
  }
  .toolbar-dates {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }
  .toolbar-dates .sep { color: var(--faint); font-size: 11px; }
  .toolbar-reset {
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .toolbar-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* 목록 */
  .feed { padding: 8px 0 0; }
  .card {
    display: block; text-decoration: none; color: inherit;
    padding: 30px 0; border-bottom: 1px solid var(--line);
    opacity: 0; transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }
  .card-tag { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .card-meta { font-size: 13px; color: var(--muted); margin-left: 10px; }
  .card-meta .dot { margin: 0 7px; color: var(--faint); }
  .card h2 {
    font-size: 22px; line-height: 1.32; font-weight: 700; letter-spacing: -0.01em;
    margin: 12px 0 8px; transition: color 0.18s ease;
  }
  .card .desc { color: var(--muted); font-size: 15px; margin: 0; }
  .card .more { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--faint); transition: color 0.18s ease, gap 0.18s ease; }
  .card .more svg { width: 14px; height: 14px; }
  /* 호버: 제목 골드, 화살표 전진 */
  .card:hover h2 { color: var(--accent); }
  .card:hover .more { color: var(--accent); gap: 11px; }
  .feed .card:last-child { border-bottom: none; }

  .eye { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; opacity: 0.7; }

  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  .empty-filter { color: var(--muted); padding: 48px 0; text-align: center; font-size: 15px; }

  .feedback {
    text-align: center;
    padding: 48px 0 24px;
    margin-top: 0;
  }
  .feedback p { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
  .feedback-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.18s ease;
  }
  .feedback-btn:hover { background: #1d4ed8; }

  footer { color: var(--faint); font-size: 12px; padding: 0 0 56px; text-align: center; }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 520px) {
    header.masthead h1 { font-size: 30px; }
    header.masthead p { white-space: normal; font-size: 13px; }
    .toolbar { justify-content: stretch; }
    .toolbar-search { max-width: none; flex: 1 1 100%; }
    .toolbar-dates { width: 100%; }
    .toolbar input[type="date"] { flex: 1; min-width: 0; }
    .card h2 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <p class="kicker">E-LAND INNOple · Weekly</p>
    <h1>AI/IT 트렌드 위클리</h1>
    <p>매주 한 주의 AI·IT 흐름을 6개 카테고리로 선별해 정리합니다. 카드를 누르면 그 주 리포트 전문이 열립니다.</p>
  </header>

  <div class="toolbar" id="toolbar" hidden>
    <div class="toolbar-search">
      <label class="visually-hidden" for="report-search">리포트 검색</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input type="search" id="report-search" placeholder="제목·요약 검색" autocomplete="off" />
    </div>
    <div class="toolbar-dates">
      <label class="visually-hidden" for="date-from">시작일</label>
      <input type="date" id="date-from" aria-label="시작일" />
      <span class="sep" aria-hidden="true">~</span>
      <label class="visually-hidden" for="date-to">종료일</label>
      <input type="date" id="date-to" aria-label="종료일" />
      <button type="button" class="toolbar-reset" id="filter-reset">초기화</button>
    </div>
  </div>

  <main class="feed" id="feed">
    <div class="empty" id="empty" hidden>아직 발행된 리포트가 없습니다.</div>
    <div class="empty-filter" id="empty-filter" hidden>조건에 맞는 리포트가 없습니다.</div>
  </main>

  <section class="feedback" aria-label="피드백">
    <p>좋은 점, 보완하고 싶은 점이 있다면 피드백 부탁드립니다.</p>
    <a class="feedback-btn" href="https://forms.gle/t3Kuu4XhtvB8qqhc7" target="_blank" rel="noopener noreferrer">피드백 남기기</a>
  </section>

  <footer id="footer"></footer>
</div>

<script>
  // 보기용 시드 — data/reports.json 을 못 읽을 때(파일 직접 열기 등) 대비한 폴백.
  // 실제 운영에서는 data/reports.json 이 최신 목록이 됩니다.
  const SEED = [
    {
      id: "2026-06-01",
      date: "2026-06-01",
      weekLabel: "2026년 6월 1주차",
      title: "AI 팩토리·베라 CPU, 에이전트 현장 확산, AI 보안·규제",
      summary: "NVIDIA가 AI 팩토리와 Vera CPU로 인프라 경제학을 재정의하고, SKT 코워크·GitHub·ITBench-AA로 엔터프라이즈 에이전트가 확산됐다. 2027년 독자 AI 보안체계와 예측 치안 등 규제 의제도 본격화됐다.",
      views: 0,
      file: "reports/weekly_ai_it_report_2026-06-01.html"
    },
    {
      id: "2026-05-25",
      date: "2026-05-25",
      title: "NVIDIA 베라 CPU, 구글 I/O 2026, AI 사전심사",
      summary: "엔비디아가 에이전트 전용 첫 CPU '베라'를 최상위 AI 랩에 공급하고, 구글은 I/O에서 제미나이 전방위 통합을 발표했다. 백악관의 90일 사전심사 추진까지 이번 주 핵심 동향을 정리했다.",
      views: 0,
      file: "reports/weekly_ai_it_report_2026-05-25.html"
    }
  ];

  const EYE = '<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return `${d.getFullYear()}년 ${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일`;
  }

  // 날짜 → "2026년 5월 4주차" (매월 1~7일=1주차, 8~14일=2주차 …)
  // reports.json·SEED의 weekLabel이 있으면 해당 값을 우선 사용
  function weekLabelFromDate(iso) {
    const d = new Date(iso + 'T12:00:00');
    if (isNaN(d)) return '';
    const week = Math.ceil(d.getDate() / 7);
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${week}주차`;
  }

  function reportWeekLabel(r) {
    if (r.weekLabel) return r.weekLabel;
    return weekLabelFromDate(r.date);
  }

  let allReports = [];

  function getFilters() {
    return {
      q: document.getElementById('report-search').value.trim().toLowerCase(),
      from: document.getElementById('date-from').value,
      to: document.getElementById('date-to').value
    };
  }

  function matchesFilter(r, { q, from, to }) {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    if (q) {
      const hay = [
        r.title,
        r.summary,
        r.date,
        fmtDate(r.date),
        reportWeekLabel(r)
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function filterReports() {
    const f = getFilters();
    return allReports.filter((r) => matchesFilter(r, f));
  }

  function updateFooter(shown, total) {
    const latest = allReports[0];
    if (!latest) {
      document.getElementById('footer').textContent = '';
      return;
    }
    const parts = [`총 ${total}개 리포트`];
    if (shown !== total) parts.push(`조회 ${shown}건`);
    parts.push(`최종 업데이트 ${fmtDate(latest.date)}`);
    document.getElementById('footer').textContent = parts.join(' · ');
  }

  function renderList(reports) {
    const feed = document.getElementById('feed');
    const empty = document.getElementById('empty');
    const emptyFilter = document.getElementById('empty-filter');
    feed.querySelectorAll('a.card').forEach((el) => el.remove());

    const sorted = [...reports].sort((a, b) => (a.date < b.date ? 1 : -1));
    empty.hidden = true;
    emptyFilter.hidden = true;

    if (!allReports.length) {
      empty.hidden = false;
      document.getElementById('toolbar').hidden = true;
      updateFooter(0, 0);
      return;
    }

    document.getElementById('toolbar').hidden = false;

    if (!sorted.length) {
      emptyFilter.hidden = false;
      updateFooter(0, allReports.length);
      return;
    }

    sorted.forEach((r, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = r.file;
      a.style.animationDelay = (i * 70) + 'ms';
      const wl = reportWeekLabel(r);
      const heading = wl ? `${wl} AI/IT 뉴스 — ${r.title}` : r.title;
      a.innerHTML = `
        <span class="card-tag">Tech Insight</span>
        <span class="card-meta">${fmtDate(r.date)}${(r.views ?? 0) > 0 ? `<span class="dot">·</span>${EYE}${r.views}` : ''}</span>
        <h2>${heading}</h2>
        <p class="desc">${r.summary || ''}</p>
        <span class="more">리포트 열기 ${ARROW}</span>`;
      feed.appendChild(a);
    });
    updateFooter(sorted.length, allReports.length);
  }

  function applyFilters() {
    renderList(filterReports());
  }

  function resetFilters() {
    document.getElementById('report-search').value = '';
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    applyFilters();
  }

  function bindToolbar() {
    document.getElementById('report-search').addEventListener('input', applyFilters);
    document.getElementById('date-from').addEventListener('change', applyFilters);
    document.getElementById('date-to').addEventListener('change', applyFilters);
    document.getElementById('filter-reset').addEventListener('click', resetFilters);
  }

  (async () => {
    let reports = SEED;
    try {
      const res = await fetch('./data/reports.json', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length) reports = data;
      }
    } catch (e) {
      // 폴백(SEED) 사용
    }
    allReports = [...reports].sort((a, b) => (a.date < b.date ? 1 : -1));
    bindToolbar();
    applyFilters();
  })();
</script>
</body>
</html>
